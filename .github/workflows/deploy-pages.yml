name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Prepare Pages artifact
        run: |
          cp CNAME .output/public/CNAME
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for the branch-based Pages build
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== "push") return;

            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: context.sha,
                per_page: 100,
              });
              const pagesBuild = data.workflow_runs.find((run) =>
                run.name === "pages build and deployment" && run.head_sha === context.sha && run.event === "dynamic"
              );

              if (pagesBuild?.status === "completed") {
                if (pagesBuild.conclusion !== "success") {
                  core.setFailed(`The branch-based Pages build ended with ${pagesBuild.conclusion}.`);
                }
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            core.setFailed("Timed out waiting for the branch-based Pages build.");

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
